# Spell and Iron Rift — server defaults. MOTD, max-players and whitelist are managed from Rift Control.
motd=Spell and Iron Rift
max-players=100
online-mode=true
enforce-secure-profile=true
prevent-proxy-connections=false
white-list=false
enforce-whitelist=false
level-name=world
difficulty=hard
gamemode=survival
pvp=true
spawn-protection=0
view-distance=12
simulation-distance=8
network-compression-threshold=256
max-tick-time=120000
sync-chunk-writes=true
# Remote console stays off: Rift Control talks to the server over its own stdin.
enable-rcon=false
enable-query=false
enable-command-block=false
allow-flight=true
log-ips=false
# resource-pack can stay empty: the launcher installs every client file itself. If you do set one,
# the client mod hides Minecraft's reload screen behind the rift tunnel while it loads.
resource-pack=
require-resource-pack=false
server-port=25565
