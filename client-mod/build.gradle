plugins {
    id 'java-library'
    // ModDevGradle — the official NeoForge Gradle plugin for 1.20.2+.
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'org.spellandironrift'
base { archivesName = 'spellironrift-core' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spellironrift'
            // end-to-end runs with two players: ./gradlew runClient -Pe2eUser=Observer
            if (project.hasProperty('e2eUser')) programArguments.addAll('--username', project.property('e2eUser').toString())
            // window size for screenshots that look like a player's screen: -Pe2eSize=1920x1080
            if (project.hasProperty('e2eSize')) {
                def wh = project.property('e2eSize').toString().split('x')
                programArguments.addAll('--width', wh[0], '--height', wh[1])
            }
        }
    }
    mods {
        spellironrift { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [mod_version: mod_version, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
