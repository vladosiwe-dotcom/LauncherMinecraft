plugins {
    id 'java-library'
    // ModDevGradle — the official NeoForge Gradle plugin for 1.20.2+.
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'org.spellandironrift'
base { archivesName = 'spellironrift-core' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spellironrift'
        }
    }
    mods {
        spellironrift { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [mod_version: mod_version, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
