name: Build

on:
  push:
  workflow_dispatch:

jobs:
  client-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the menu mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: spellironrift-core-jar
          path: client-mod/build/libs/*.jar
          if-no-files-found: error

  server-guard-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the server guard mod
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: spellironrift-guard-jar
          path: server-mod/build/libs/*.jar
          if-no-files-found: error

  launcher-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  launcher-installers:
    needs: launcher-and-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: launcher/.stage/release/*.exe
          - os: ubuntu-latest
            target: --linux
            files: launcher/.stage/release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage the launcher outside the workspace
        run: node launcher/scripts/stage.mjs
      - name: Package the launcher
        working-directory: launcher/.stage
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # A real player's path: dedicated server with Solo Status + Create (+ optional mods), a game client with the
  # Rift menu that presses "Enter the Rift", flies in, opens the System window and quits. Screenshots and logs
  # are attached to the run. Fails on a crash report, a failed connection or a missing step.
  end-to-end:
    needs: client-mod
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the screenshots to the e2e-frames branch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: rift
      - uses: actions/checkout@v4
        with:
          ref: claude/skills-connection-7u72hg
          path: solo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Solo Status
        working-directory: solo
        run: ./gradlew build --no-daemon -q && ls -l build/libs
      - name: Fetch Create and other mods from Modrinth
        run: python3 rift/tools/e2e/fetch_mods.py mods-server mods-client "$GITHUB_STEP_SUMMARY" required:create optional:sable optional:epic-fight optional:irons-spells-n-spellbooks+irons-lib+curios+geckolib+playeranimator
      - name: Install a NeoForge 1.21.1 server
        run: |
          mkdir -p server/mods
          curl -sSfL -o installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.228/neoforge-21.1.228-installer.jar
          (cd server && java -jar ../installer.jar --installServer . > install.log 2>&1)
          echo "eula=true" > server/eula.txt
          cp rift/tools/e2e/server.properties server/server.properties
          echo "-Xmx3G" > server/user_jvm_args.txt
          cp mods-server/*.jar server/mods/ 2>/dev/null || true
          cp solo/build/libs/*.jar server/mods/
          ls server/mods
      - name: Start the server
        run: |
          cd server
          SOLO_E2E_BOT=1 nohup ./run.sh nogui > server.log 2>&1 &  # a second player wakes up in front of the client
          for i in $(seq 1 180); do
            if grep -q 'Done (' server.log; then echo "server is up"; exit 0; fi
            if [ -d crash-reports ] || ! pgrep -f 'neoforge' > /dev/null; then echo "::error::server crashed or exited while starting"; tail -80 server.log; exit 1; fi
            sleep 2
          done
          echo "::error::server did not start in 6 minutes"; tail -80 server.log; exit 1
      - name: Prepare the game client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          RUN=rift/client-mod/run
          mkdir -p $RUN/mods $RUN/spellironrift
          cp mods-client/*.jar $RUN/mods/ 2>/dev/null || true
          cp solo/build/libs/*.jar $RUN/mods/
          cp rift/tools/e2e/options.txt $RUN/options.txt
          echo '{"server":{"host":"127.0.0.1","port":25565},"apiBase":"","preset":"balanced","buildVersion":"e2e"}' > $RUN/spellironrift/launcher.json
      - name: Play (menu, enter the rift, world, System window)
        working-directory: rift/client-mod
        env:
          RIFT_E2E: '1'
          SOLO_E2E_SHOTS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > client.log 2>&1
          echo "client exited with $?"
          grep -E "E2E:" client.log || true
          ok=1
          grep -q "E2E: passed" client.log || { echo "::error::the player's path did not complete"; ok=0; }
          if ls run/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::client crash report"; head -60 run/crash-reports/*.txt; ok=0; fi
          if ls ../../server/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::server crash report"; head -60 ../../server/crash-reports/*.txt; ok=0; fi
          grep -q "joined the game" ../../server/server.log || { echo "::error::nobody joined the server"; ok=0; }
          [ $ok = 1 ] || { tail -120 client.log; exit 1; }
      # The awakening scene of Solo Status plays on the first entry: its frames are printed small (JPEG, base64)
      # so they can be read straight from the log, and the log lines show whether GeckoLib drew it.
      # The awakening scene of Solo Status plays on the first entry. Its frames go to the e2e-frames branch
      # (replaced each run), where they can be looked at without downloading the artifact.
      - name: Awakening scene frames
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          grep -E "Awakening:" rift/client-mod/client.log | head -20 || true
          ls rift/client-mod/run/screenshots/awakening-*.png > /dev/null 2>&1 || { echo "no awakening frames"; exit 0; }
          pip install -q pillow
          mkdir -p /tmp/frames
          python3 -c "
          import glob
          from PIL import Image
          for p in sorted(glob.glob('rift/client-mod/run/screenshots/*.png')):
              im = Image.open(p).convert('RGB'); im.thumbnail((640, 360)); im.save('/tmp/frames/' + p.rsplit('/', 1)[-1])
          "
          grep -E "Awakening:|E2E:|Epic Fight:" rift/client-mod/client.log > /tmp/frames/log.txt || true
          grep -E "Awakening e2e|Hunter_Bot|Exception" server/server.log | head -40 > /tmp/frames/server-log.txt || true
          cp rift/client-mod/run/config/epicfight*.toml /tmp/frames/ 2>/dev/null || true
          jar=$(ls mods-client/*epic*fight*.jar 2>/dev/null | head -1)
          if [ -n "$jar" ]; then
            { unzip -l "$jar" | grep -oE "yesman/[A-Za-z0-9_/$]*(PlayerPatch|Config|Option|FirstPerson|RenderEngine|PlayerMode)[A-Za-z0-9_$]*\.class" | sort -u
              for c in yesman.epicfight.world.capabilities.entitypatch.player.PlayerPatch yesman.epicfight.client.world.capabilities.entitypatch.player.LocalPlayerPatch; do
                echo "== $c"; javap -cp "$jar" "$c" 2>&1 | grep -iE "mode|battle|mining|class |firstperson|first_person"; done
            } > /tmp/frames/epicfight-api.txt 2>&1 || true
          fi
          # the scene as a video: one frame per client tick (20 fps), 960 px wide
          if ls rift/client-mod/run/screenshots/awakening-v-*.png > /dev/null 2>&1; then
            command -v ffmpeg > /dev/null || sudo apt-get install -y -qq ffmpeg > /dev/null
            ffmpeg -loglevel error -y -framerate 20 -i rift/client-mod/run/screenshots/awakening-v-%03d.png \
              -vf "scale=960:-2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/frames/awakening.mp4
            rm -f /tmp/frames/awakening-v-*.png
          fi
          # what the client saw of another player's awakening (the multiplayer view)
          if ls rift/client-mod/run/screenshots/awakening-o-*.png > /dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 20 -i rift/client-mod/run/screenshots/awakening-o-%03d.png \
              -vf "scale=960:-2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/frames/awakening-other.mp4
            rm -f /tmp/frames/awakening-o-*.png
            ls -la /tmp/frames/awakening.mp4
          fi
          cd /tmp/frames && git init -q && git checkout -q -b e2e-frames && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "End-to-end frames, run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" e2e-frames
      - name: Stop the server
        if: always()
        run: pkill -f neoforge || true
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end
          path: |
            rift/client-mod/run/screenshots/
            rift/client-mod/client.log
            rift/client-mod/run/logs/latest.log
            rift/client-mod/run/crash-reports/
            server/server.log
            server/crash-reports/
          if-no-files-found: warn
