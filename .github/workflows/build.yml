name: Build

on:
  push:
  workflow_dispatch:

jobs:
  client-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the menu mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: spellironrift-core-jar
          path: client-mod/build/libs/*.jar
          if-no-files-found: error

  launcher-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  launcher-installers:
    needs: launcher-and-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: launcher/release/*.exe
          - os: ubuntu-latest
            target: --linux
            files: launcher/release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the launcher
        working-directory: launcher
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
