name: Build

on:
  push:
  workflow_dispatch:

jobs:
  client-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the menu mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: spellironrift-core-jar
          path: client-mod/build/libs/*.jar
          if-no-files-found: error

  server-guard-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the server guard mod
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: spellironrift-guard-jar
          path: server-mod/build/libs/*.jar
          if-no-files-found: error

  launcher-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  launcher-installers:
    needs: launcher-and-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: launcher/.stage/release/*.exe
          - os: ubuntu-latest
            target: --linux
            files: launcher/.stage/release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage the launcher outside the workspace
        run: node launcher/scripts/stage.mjs
      - name: Package the launcher
        working-directory: launcher/.stage
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # A real player's path: dedicated server with Solo Status + Create (+ optional mods), a game client with the
  # Rift menu that presses "Enter the Rift", flies in, opens the System window and quits. Screenshots and logs
  # are attached to the run. Fails on a crash report, a failed connection or a missing step.
  end-to-end:
    needs: client-mod
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to publish the screenshots to the e2e-frames branch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: rift
      - uses: actions/checkout@v4
        with:
          ref: claude/skills-connection-7u72hg
          path: solo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Solo Status
        working-directory: solo
        run: ./gradlew build --no-daemon -q && ls -l build/libs
      - name: Fetch Create and other mods from Modrinth
        run: python3 rift/tools/e2e/fetch_mods.py mods-server mods-client "$GITHUB_STEP_SUMMARY" required:create optional:sable optional:epic-fight optional:irons-spells-n-spellbooks+irons-lib+curios+geckolib+playeranimator
      - name: Install a NeoForge 1.21.1 server
        run: |
          mkdir -p server/mods
          curl -sSfL -o installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.228/neoforge-21.1.228-installer.jar
          (cd server && java -jar ../installer.jar --installServer . > install.log 2>&1)
          echo "eula=true" > server/eula.txt
          cp rift/tools/e2e/server.properties server/server.properties
          echo "-Xmx3G" > server/user_jvm_args.txt
          cp mods-server/*.jar server/mods/ 2>/dev/null || true
          cp solo/build/libs/*.jar server/mods/
          ls server/mods
      - name: Start the server
        run: |
          cd server
          SOLO_E2E_PLACE=1 nohup ./run.sh nogui > server.log 2>&1 &  # the second player to join is put in front of the first
          for i in $(seq 1 180); do
            if grep -q 'Done (' server.log; then echo "server is up"; exit 0; fi
            if [ -d crash-reports ] || ! pgrep -f 'neoforge' > /dev/null; then echo "::error::server crashed or exited while starting"; tail -80 server.log; exit 1; fi
            sleep 2
          done
          echo "::error::server did not start in 6 minutes"; tail -80 server.log; exit 1
      # Two real game clients: "Observer" joins first and waits; "Waker" joins later, is put in front of the
      # Observer and wakes up. Each client has its own game folder and window (Xvfb display).
      - name: Prepare two game clients
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils ffmpeg > /dev/null
          rsync -a --exclude run --exclude .gradle --exclude build rift/client-mod/ /tmp/clientB/
          for RUN in rift/client-mod/run /tmp/clientB/run; do
            mkdir -p $RUN/mods $RUN/spellironrift
            cp mods-client/*.jar $RUN/mods/ 2>/dev/null || true
            cp solo/build/libs/*.jar $RUN/mods/
            cp rift/tools/e2e/options.txt $RUN/options.txt
            echo '{"server":{"host":"127.0.0.1","port":25565},"apiBase":"","preset":"balanced","buildVersion":"e2e"}' > $RUN/spellironrift/launcher.json
          done
      - name: Play with two players (Observer watches Waker wake up)
        env:
          RIFT_E2E: '1'
          SOLO_E2E_SHOTS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          A=$PWD/rift/client-mod; B=/tmp/clientB
          (cd $A && RIFT_E2E_WAIT_PLAYER=1 timeout 1800 xvfb-run -n 91 -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon -Pe2eUser=Observer > client.log 2>&1) &
          PA=$!
          for i in $(seq 1 600); do grep -q "E2E: in the world" $A/client.log 2>/dev/null && break; kill -0 $PA 2>/dev/null || break; sleep 2; done
          grep -q "E2E: in the world" $A/client.log || { echo "::error::Observer did not get into the world"; tail -80 $A/client.log; exit 1; }
          echo "Observer is in the world; starting Waker"
          (cd $B && timeout 1500 xvfb-run -n 92 -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon -Pe2eUser=Waker > client.log 2>&1) &
          PB=$!
          wait $PB; echo "Waker exited with $?"
          wait $PA; echo "Observer exited with $?"
          ok=1
          for C in $A $B; do
            grep -E "E2E:" $C/client.log | tail -12
            grep -q "E2E: passed" $C/client.log || { echo "::error::$C did not complete the player's path"; tail -60 $C/client.log; ok=0; }
            if ls $C/run/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::client crash report in $C"; head -60 $C/run/crash-reports/*.txt; ok=0; fi
          done
          if ls server/crash-reports/*.txt > /dev/null 2>&1; then echo "::error::server crash report"; head -60 server/crash-reports/*.txt; ok=0; fi
          grep -q "Observer joined the game" server/server.log && grep -q "Waker joined the game" server/server.log || { echo "::error::both players must join"; ok=0; }
          [ $ok = 1 ] || exit 1
      # What each client logged about the Waker's scene (game ticks): the scene must start, last and end at the
      # same moments on the server, on the Waker's own client and on the Observer's client, and the Observer must
      # see the Waker drawn as a normal player again afterwards.
      - name: Multiplayer awakening in sync
        run: |
          python3 - <<'PY'
          import re, os, sys
          def lines(path, pat):
              try: return [l for l in open(path, errors='replace') if pat in l]
              except FileNotFoundError: return []
          def find(path, pat):
              for l in lines(path, pat):
                  t = re.search(r' at (-?\d+)', l); ms = re.search(r' ms (\d+)', l)
                  if t and ms: return int(t.group(1)), int(ms.group(1))
              return None
          A, B, S = 'rift/client-mod/client.log', '/tmp/clientB/client.log', 'server/server.log'
          v = {
            'server start': find(S, 'Awakening sync: server start Waker'),
            'server end': find(S, 'Awakening sync: server end Waker'),
            'Waker sees own start': find(B, 'Awakening sync: client own start Waker'),
            'Waker sees own end': find(B, 'Awakening sync: client own end Waker'),
            'Waker view back to normal': find(B, 'Awakening sync: client own view back to normal'),
            'Observer sees start': find(A, 'Awakening sync: client sees start Waker'),
            'Observer sees end': find(A, 'Awakening sync: client sees end Waker'),
            'Observer sees normal player again': find(A, 'Awakening sync: client sees Waker drawn as a normal player'),
          }
          errors = [f'missing: {k}' for k, x in v.items() if x is None]
          base = v['server start'][1] if v['server start'] else 0
          rows = ['| Event | Game tick (that process) | Real time, ms from server start |', '|---|---|---|'] + \
                 [f'| {k} | {x[0] if x else "—"} | {x[1] - base if x else "—"} |' for k, x in v.items()]
          if not errors:
              ms = {k: x[1] for k, x in v.items()}
              def near(a, b, d, what):
                  if abs(a - b) > d: errors.append(f'{what}: {a} vs {b} ms (allowed ±{d})')
              near(ms['Waker sees own start'], ms['server start'], 300, 'Waker start vs server')
              near(ms['Observer sees start'], ms['server start'], 300, 'Observer start vs server')
              near(ms['Observer sees start'], ms['Waker sees own start'], 300, 'start on both clients')
              near(ms['server end'] - ms['server start'], 8000, 300, 'server duration')
              near(ms['Waker sees own end'] - ms['Waker sees own start'], 8000, 400, 'Waker duration')
              near(ms['Observer sees end'] - ms['Observer sees start'], 8000, 400, 'Observer duration')
              near(ms['Observer sees end'], ms['Waker sees own end'], 400, 'end on both clients')
              if ms['Observer sees normal player again'] < ms['Observer sees end'] - 100: errors.append('Observer saw a normal player before the end')
          report = '### Multiplayer awakening (Waker seen by Observer)\n\n' + '\n'.join(rows) + '\n\n' + ('**In sync.**' if not errors else '**Problems:** ' + '; '.join(errors)) + '\n'
          print(report)
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(report)
          os.makedirs('/tmp/frames', exist_ok=True); open('/tmp/frames/sync.md', 'w').write(report)
          sys.exit(1 if errors else 0)
          PY
      # Videos and logs go to the e2e-frames branch (replaced each run), where they can be looked at without
      # downloading the artifact: the Observer's view of the Waker, and the Waker's own first-person view.
      - name: Awakening videos
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/frames
          A=rift/client-mod; B=/tmp/clientB
          video() { ls $1/run/screenshots/$2-*.png > /dev/null 2>&1 && ffmpeg -loglevel error -y -framerate 20 -i $1/run/screenshots/$2-%03d.png \
              -vf "scale=960:-2" -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/frames/$3; }
          video $A awakening-o observer-sees-waker.mp4
          video $B awakening-v waker-first-person.mp4
          video $A awakening-v observer-own-entry.mp4
          for C in $A $B; do n=$(basename $(dirname $C/run))-$(basename $C); grep -E "Awakening|E2E:|Epic Fight:" $C/client.log > /tmp/frames/log-$(basename $C).txt || true; done
          grep -E "Awakening|joined the game|left the game|Exception" server/server.log | head -60 > /tmp/frames/server-log.txt || true
          for C in $A $B; do for f in $C/run/screenshots/e2e-*.png; do [ -f "$f" ] && cp "$f" /tmp/frames/$(basename $C)-$(basename $f); done; done
          ls -la /tmp/frames
          cd /tmp/frames && git init -q && git checkout -q -b e2e-frames && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "End-to-end frames, run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" e2e-frames
      - name: Stop the server
        if: always()
        run: pkill -f neoforge || true
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end
          path: |
            rift/client-mod/run/screenshots/
            rift/client-mod/client.log
            rift/client-mod/run/logs/latest.log
            /tmp/clientB/client.log
            /tmp/clientB/run/screenshots/
            rift/client-mod/run/crash-reports/
            server/server.log
            server/crash-reports/
          if-no-files-found: warn
