modLoader = "javafml"
loaderVersion = "[4,)"
license = "All rights reserved"

[[mods]]
modId = "spellironrift_guard"
version = "${mod_version}"
displayName = "Spell and Iron Rift Guard"
authors = "Spell and Iron Rift team"
description = '''
Server-side Rift authentication for offline-mode Minecraft servers. Players must connect through the Spell and Iron Rift launcher with a short-lived, one-use Rift game ticket. The server verifies tickets with the Rift backend and applies account roles.
'''
# Server-only: players do not need this mod.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.spellironrift_guard]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.spellironrift_guard]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "SERVER"
